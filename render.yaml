services:
  - type: web
    name: smartbin-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --loop asyncio
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MQTT_HOST
        value: YOUR_HIVEMQ_HOST.s1.eu.hivemq.cloud
      - key: MQTT_PORT
        value: "8883"
      - key: MQTT_USER
        value: smartbin
      - key: MQTT_PASS
        value: YOUR_MQTT_PASSWORD
